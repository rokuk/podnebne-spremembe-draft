{{- if not .PlainText }}{{ errorf "Image %q has no alt text (%s)" .Destination .Page.File.Path }}{{ end -}}
{{- if .IsBlock -}}
<figure class="figure"><img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy">{{ with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}</figure>
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy">
{{- end -}}
