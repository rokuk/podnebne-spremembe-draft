<!DOCTYPE html>
<html lang="sl" data-theme="light" data-design="{{ site.Params.design | default "a" }}">
<head>
{{- partial "head.html" . -}}
</head>
{{- $accent := or .Params.level .Section -}}
<body data-accent="{{ $accent }}" class="kind-{{ .Kind }} type-{{ .Type }}">
<a class="skip-link" href="#main">{{ i18n "skip" }}</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{- $js := resources.Get "js/main.js" | fingerprint -}}
<script src="{{ $js.RelPermalink }}" defer></script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
