{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<article class="container narrow prose-page" data-pagefind-body>
  {{ partial "pagefind-meta.html" . }}
  <p class="eyebrow"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2. 1. 2006" }}</time></p>
  <h1 data-pagefind-meta="title">{{ .Title }}</h1>
  {{- with .Params.summary }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
