{{- /* Context: level slug (string). Returns <abbr> with the short name (OŠ, SŠ, ST) from data/levels.yaml. */ -}}
{{- $slug := . -}}
{{- $out := "" -}}
{{- range hugo.Data.levels }}{{ if eq .slug $slug }}{{ $out = printf "<abbr title=\"%s\">%s</abbr>" .name .short }}{{ end }}{{ end -}}
{{- return ($out | safeHTML) -}}
