# Builds the Hugo site with the Pagefind search index and deploys it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0
      HUGO_ENVIRONMENT: production
      TZ: Europe/Ljubljana
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies (Pagefind)
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # The site is built into _site/<base path> so that root-relative links
      # (/podnebne-spremembe-draft/...) resolve when checking links against _site.
      - name: Build site
        run: |
          echo "SITE_DIR=_site${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination "_site${{ steps.pages.outputs.base_path }}"

      - name: Build search index
        run: npx pagefind --site "$SITE_DIR"

      - name: Check internal links
        run: node scripts/check-links.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
